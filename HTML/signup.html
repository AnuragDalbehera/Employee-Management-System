<!DOCTYPE html>
<html>
    <head>
        <title>Sign-Up</title>
        <link rel="stylesheet" href="../CSS/signup.css">
    </head>
    <body>
        <h1>EMS</h1>
        <div class="container">
            <form id="signupForm" action="../PHP/signup.php" method="POST">
                <h2>Sign Up</h2>

                <label>Username</label>
                <input type="text" id="username" placeholder="Your Username" name="username" required>

                <label>Email</label>
                <input type="email" id="email" placeholder="Your Email" name="email" required>
                <small id="emailError">Please Enter A Valid Email Address...</small>

                <label>Password</label>
                <input type="password" id="password" placeholder="Your Password" name="password" required>

                <label>Confirm Password</label>
                <input type="password" id="confirmpassword" placeholder="Your Password Again" name="confirmpassword" onblur="validatePassword()" required>
                <small id="passwordError">Passwords Don't Match...</small>

                <p>Already Have An Account <a href="login.html">Login</a></p>

                <button type="submit">Sign Up</button>
            </form>
        </div>
        <script src="../JS/signup.js"></script>
    </body>
</html>
